name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The sync workflow starts this on its branch, because GitHub does not
  # start CI for a pull request that a workflow's own token opens.
  workflow_dispatch:
  # Weekly, so a break in the toolchain install or the runner shows up
  # even in a week with no change here. Upstream changes reach this repo
  # through the sync workflow instead.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  consistency:
    name: Pins agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-consistency.py
      - name: Sync unit tests
        run: python3 -m unittest discover -s scripts -v

  build:
    name: Build
    needs: consistency
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: sh scripts/setup-lean.sh
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      # Lake fetches the packages at the revs in the committed manifest.
      - name: Joint build
        run: lake build Anthology AnthologyProofs
      - name: Per-package build, including every Spec and Proofs library
        run: scripts/build-all.sh
      - name: Proof audit matches audit.json
        run: python3 scripts/audit.py --check
