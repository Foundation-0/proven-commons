name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, to report pins that have fallen behind upstream main.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  consistency:
    name: Pins agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-consistency.py

  pin-freshness:
    name: Pins match upstream main
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update-pins.py --check

  build:
    name: Build
    needs: consistency
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
      # Lake fetches the packages at the revs in the committed manifest.
      - name: Joint build
        run: lake build Anthology
      - name: Per-package build, including Proofs libraries
        run: scripts/build-all.sh
